name: fitcheck
description: "FitCheck — digitize your wardrobe as attributes, not photos, and get a second opinion on any outfit."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  image: ^4.8.0
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  sqflite: ^2.4.2+1
  supabase_flutter: ^2.16.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Read at startup by flutter_dotenv so `flutter run` needs no --dart-define arguments.
    #
    # This BUNDLES the file into the app, where it can be extracted from the build. Only the three
    # public values belong in it — SUPABASE_URL, SUPABASE_ANON_KEY, BACKEND_URL. Server secrets go
    # in backend/.env; main.dart refuses to launch if it finds one here.
    #
    # `flutter build` fails if this file does not exist. Copy .env.example to .env after cloning.
    - .env
